version: 2
updates:
  # Keep GitHub Actions current (e.g. Node.js runtime deprecations).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Keep uv.lock dev tooling current.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore
