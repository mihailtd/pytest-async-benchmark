name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint, format & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: ty type check
        run: uv run ty check --output-format=github

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short

      - name: Test examples
        run: |
          uv run python -m pytest examples/pytest_examples.py examples/pedantic_examples.py examples/fastapi_examples.py examples/fastmcp_examples.py -v -rs
          uv run python examples/comparison_examples.py

      - name: Test package build
        run: |
          uv build
          # Verify the package can be installed
          uv pip install dist/*.whl
          # Test that the plugin is discoverable
          uv run python -c "import pytest_async_benchmark; print('✅ Package imports successfully')"
