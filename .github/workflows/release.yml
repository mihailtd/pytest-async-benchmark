name: Release to PyPI

on:
  # Pushing a vX.Y.Z tag is the release. The GitHub release is created by the
  # create-github-release job below, so there is no `release: published` trigger
  # (it would publish the same version to PyPI twice).
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match git tag)"
        required: true
        type: string

env:
  PYTHON_VERSION: "3.11"

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-prerelease: ${{ steps.check-prerelease.outputs.is-prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Get version from tag or input
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            echo "❌ Unable to determine version from event: ${{ github.event_name }}"
            exit 1
          fi

          VERSION=${VERSION#v}

          echo "Event: ${{ github.event_name }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version consistency
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"

          # Check pyproject.toml version
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          # Check __init__.py version
          INIT_VERSION=$(grep '^__version__ = ' src/pytest_async_benchmark/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')

          echo "Tag/Input version: $VERSION"
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          echo "__init__.py version: $INIT_VERSION"

          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "❌ Version mismatch: tag ($VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi

          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "❌ Version mismatch: tag ($VERSION) != __init__.py ($INIT_VERSION)"
            exit 1
          fi

          echo "✅ All versions are consistent: $VERSION"

      - name: Check if prerelease
        id: check-prerelease
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ Stable release version: $VERSION"
          else
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
            echo "🧪 Pre-release version: $VERSION"
          fi

      - name: Run comprehensive tests
        run: |
          echo "🔍 Running comprehensive release checks..."

          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref_type }}" == "tag" ]; then
            echo "ℹ️  Tag-triggered release detected, running basic checks only..."

            # Run basic checks without tag validation
            uv run pytest tests/ -v --tb=short
            uv run ruff check .
            uv run ruff format --check .
            uv run ty check

            echo "✅ Basic checks passed for tag-triggered release"
          else
            # Full release check for manual triggers
            python scripts/release-check.py
          fi

  test-matrix:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies and run tests
        run: |
          echo "🧪 Testing on Python ${{ matrix.python-version }}..."
          uv sync --dev
          uv run pytest tests/ -v --tb=short

          echo "📝 Testing examples..."
          uv run python -m pytest examples/pytest_examples.py -v

          echo "🔍 Testing plugin discovery..."
          uv run python -c "import pytest_async_benchmark; print(f'✅ Plugin imported successfully - version: {pytest_async_benchmark.__version__}')"

  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate-release, test-matrix]
    environment: release

    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI
      attestations: write # Required for package attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: |
          echo "🔨 Building package for release..."
          uv build

          echo "📦 Built packages:"
          ls -la dist/

          echo "📋 Package contents:"
          for file in dist/*; do
            echo "=== $file ==="
            if [[ $file == *.whl ]]; then
              python -m zipfile -l "$file"
            elif [[ $file == *.tar.gz ]]; then
              tar -tzf "$file" | head -20
            fi
            echo ""
          done

      # Test the exact files that will be uploaded, before uploading them:
      # a PyPI version can never be replaced, so this is the last chance.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install --quiet dist/*.whl
          mkdir /tmp/smoke && cd /tmp/smoke  # away from the checkout, so src/ isn't imported
          cat > test_smoke.py <<'PY'
          import asyncio

          import pytest_async_benchmark


          async def work():
              await asyncio.sleep(0.001)


          def test_version():
              assert pytest_async_benchmark.__version__ == "${{ needs.validate-release.outputs.version }}"


          def test_plugin_runs(async_benchmark):
              result = async_benchmark(work, rounds=3)
              assert result["rounds"] == 3 and "p99" in result
          PY
          /tmp/wheel-test/bin/python -m pytest test_smoke.py -v -p no:cacheprovider

      - name: Generate package attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true
          attestations: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist-${{ needs.validate-release.outputs.version }}
          path: dist/
          retention-days: 90

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          # Everything between "## [VERSION]" and the next "## [" heading.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "⚠️ No CHANGELOG.md section for $VERSION, using a link instead"
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)." > notes.md
          fi

          {
            echo ""
            echo "### 📦 Installation"
            echo '```bash'
            echo "pip install pytest-async-benchmark==$VERSION"
            echo '```'
            echo ""
            echo "**PyPI:** https://pypi.org/project/pytest-async-benchmark/$VERSION/"
          } >> notes.md
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ needs.validate-release.outputs.is-prerelease }}" == "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag \
            $PRERELEASE_FLAG

  post-release:
    name: Post-Release Tasks
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-publish]
    if: always() && needs.build-and-publish.result == 'success'

    steps:
      - name: Create release summary
        run: |
          VERSION="${{ needs.validate-release.outputs.version }}"
          IS_PRERELEASE="${{ needs.validate-release.outputs.is-prerelease }}"

          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** $([ "$IS_PRERELEASE" == "true" ] && echo "Pre-release 🧪" || echo "Stable Release ✅")" >> $GITHUB_STEP_SUMMARY
          echo "- **PyPI URL:** https://pypi.org/project/pytest-async-benchmark/$VERSION/" >> $GITHUB_STEP_SUMMARY
          echo "- **Documentation:** https://github.com/${{ github.repository }}#readme" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install pytest-async-benchmark==$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "# or" >> $GITHUB_STEP_SUMMARY
          echo "uv add pytest-async-benchmark==$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎉 What's New" >> $GITHUB_STEP_SUMMARY
          echo "Check the [release notes](https://github.com/${{ github.repository }}/releases/tag/v$VERSION) for detailed changes." >> $GITHUB_STEP_SUMMARY

          echo "🎉 Successfully released pytest-async-benchmark v$VERSION to PyPI!"
