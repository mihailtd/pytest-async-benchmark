<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>pytest-async-benchmark</title>
  <defs>
    <linearGradient id="g" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="spark" x1="16" y1="36" x2="48" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Outer stopwatch ring -->
  <circle cx="32" cy="35" r="23" stroke="url(#g)" stroke-width="4"/>
  <!-- Top button -->
  <rect x="29" y="5" width="6" height="5" rx="2" fill="url(#g)"/>
  <rect x="27" y="10" width="10" height="2" rx="1" fill="url(#g)"/>
  <!-- Side angle clickers -->
  <rect x="46" y="13" width="5" height="3" rx="1" transform="rotate(40 46 13)" fill="url(#g)"/>
  <!-- Ticks -->
  <line x1="32" y1="16" x2="32" y2="20" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51" y1="35" x2="47" y2="35" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="13" y1="35" x2="17" y2="35" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Async loop benchmark sparkline -->
  <path d="M19 37 Q25 24 32 35 T45 32" stroke="url(#spark)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- High precision center needle -->
  <circle cx="32" cy="35" r="3.5" fill="#38bdf8"/>
  <line x1="32" y1="35" x2="40" y2="25" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
