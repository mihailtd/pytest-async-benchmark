[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-async-benchmark"
version = "0.3.0"
description = "pytest-async-benchmark: Modern pytest benchmarking for async code. 🚀"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Mihai Farcas", email = "contact@mihai.ltd" },
]
dependencies = [
    "pytest>=8.3.5",
    "rich>=14.0.0",
]

[project.optional-dependencies]
asyncio = [
    "pytest-asyncio>=0.23.0",
]


[project.entry-points."pytest11"]
async_bench = "pytest_async_benchmark.plugin"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.11",
    "quart>=0.20.0",
    "aiohttp>=3.12.1",
    # FastAPI / FastMCP examples (both require Python 3.10+)
    "fastapi>=0.115.0; python_version >= '3.10'",
    "httpx>=0.27.0; python_version >= '3.10'",
    "fastmcp>=2.10.0; python_version >= '3.10'",
    "pre-commit>=3.6.0",
    # ty is pre-1.0: pin exactly so new releases can't break CI unannounced
    "ty==0.0.101",
]

# Quart's TestClientProtocol/QuartClient annotate __aexit__ with non-Optional
# exception types, so ty rejects every `async with client:`. Upstream bug, not ours.
[[tool.ty.overrides]]
include = ["examples/quart_api_comparison.py"]

[tool.ty.overrides.rules]
invalid-context-manager = "ignore"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
